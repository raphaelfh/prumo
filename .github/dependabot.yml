version: 2
updates:
  # `uv`, NOT `pip`: the pip ecosystem does not manage `uv.lock`, and the lock
  # is what CI (`uv sync --frozen`) and the image (`uv export`) install. With
  # pip, backend lock updates were never automated at all — 26 of 28 direct
  # deps are lower-bound-only (`openai>=1.0.0`), so a new release needs no
  # manifest edit and dependabot had nothing to open a PR about. Six months of
  # `git log backend/uv.lock` shows zero bot commits; every bump was a human
  # doing something else, and the only dependency-driven ones were reactive
  # CVE sweeps (#245, #541, #641).
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    # Transitive deps too — dependabot defaults to DIRECT dependencies only,
    # and the package that zeroed every prod token count for three weeks
    # (genai-prices, via pydantic-ai) is transitive: it appears in `uv.lock`
    # and nowhere in `pyproject.toml`, so no direct-only config could ever
    # surface it. `all` = direct + dependencies of direct, for uv.
    allow:
      - dependency-type: all
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    # Don't auto-rebase on every base-branch commit (avoids CI re-run
    # storms under concurrent merges). Unstick a stale PR via the native
    # Update-branch button — never `@dependabot rebase` a grouped PR
    # (it closes and recreates the PR under a new number + branch).
    rebase-strategy: disabled
    ignore:
      # Deliberate pin (see backend/pyproject.toml): the parser stack is
      # drift-sensitive — an unpinned rapidocr bump broke prod via
      # docling's OCR default. Bumps are done deliberately with a manual
      # parse re-test, never via automated PRs.
      - dependency-name: docling
      # Major = a deliberate framework migration (pydantic-ai 2.x has
      # breaking changes across agents/tools APIs). The <2.0.0 ceiling in
      # pyproject is intentional; widen it only in a planned migration PR.
      # Fully ignored (no update-types filter): dependabot classifies a
      # range-widening PR (<2.0.0 -> <3.0.0) as NOT semver-major, so the
      # narrower rule failed to stop #409/#546 from reopening.
      #
      # NOTE, since the pip -> uv switch: "a full ignore loses nothing" is no
      # longer true. Under pip an in-range minor needed no manifest change, so
      # there was nothing to ignore; under uv an in-range 1.107.0 -> 1.107.x
      # IS a lock change, and this rule now blocks it. That is deliberate but
      # it has a cost: genai-prices (transitive, NOT ignored) can move while
      # pydantic-ai stays pinned, and that exact pairing is what zeroed prod's
      # token counts. `tests/unit/llm/test_extractor.py` guards the seam, so
      # the mismatch surfaces as a RED dependabot PR rather than silent
      # zeroes — unpin here only alongside that guard, never without it.
      - dependency-name: pydantic-ai-slim

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    ignore:
      # TypeScript majors are blocked: openapi-typescript (critical for
      # generate:api-types) peers on "^5.x" as of its latest 7.13.0 —
      # TS 6 and TS 7 (#548) both fail that peer range. Unblock
      # deliberately when openapi-typescript ships support, like the
      # pydantic-ai migration.
      - dependency-name: typescript
        versions: [">=6.0.0"]
      # Babel 8 is blocked until babel-plugin-react-compiler supports it:
      # the React Compiler build pipeline (vite.shared-plugins.ts,
      # panicThreshold all_errors) hard-fails lint/tests/build under
      # @babel/core 8 (PR #442). Revisit when the compiler ships
      # Babel 8 support.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the runtime major (Node 24 LTS — .nvmrc,
      # engines, CI). Types for a newer Node would let code reference
      # APIs the runtime doesn't have; bump together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        # Minor/patch group (auto-merge-eligible). Majors open as
        # individual PRs for human review — grouped majors were
        # un-auto-mergeable and drove the rebase-recreation churn.
        update-types: [minor, patch]
    rebase-strategy: disabled
