name: Post-deploy Smoke

# The closing gate: everything else proves the application works, this
# proves it shipped, in two layers.
#
#   1. Reachability — /health, frontend root, CORS preflight. /health also
#      reports jwks_ready / db_ready / storage_ready, so subsystem readiness
#      is covered here without any credential.
#   2. Deployed commit — /health.commit vs the promoted SHA. Reachability
#      alone cannot tell a fresh deploy from one stuck on an older commit,
#      which is the documented failure class (CI green, prod stale).
#      Push-triggered runs POLL and only ever warn: they race the very
#      Coolify build they verify, so a slow build is not a stale deploy.
#      The 6-hourly scheduled run is the blocking alarm.
#
# There is deliberately NO credentialed probe and no Playwright suite
# against prod. An authenticated probe would add only the narrow delta
# between "JWKS loaded at boot" and "a freshly minted token is accepted",
# at the cost of a permanent prod password living in CI; a writing suite
# is worse still (the deleted remote-smoke project dispatched a real AI
# extraction, burning LLM budget and leaving a run behind per execution).
#
# Runs after every push to main (deploy trigger) with a delay for the
# Coolify build + rollout, plus every 6 hours as a synthetic
# monitor. A failure emails the repo owner via standard workflow
# notifications.

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

env:
  API_BASE: https://prumo-api.healthnumbers.com.br
  FRONTEND_BASE: https://prumoai.vercel.app

jobs:
  smoke:
    name: Prod reachability
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Coolify deploy (push only)
        if: github.event_name == 'push'
        run: sleep 420

      - name: Backend /health
        run: |
          CODE=$(curl -fsS --max-time 15 -o /tmp/health.json -w "%{http_code}" \
            "$API_BASE/health") || CODE=000
          echo "health -> $CODE"
          cat /tmp/health.json 2>/dev/null || true
          [ "$CODE" = "200" ]

      - name: Deployed commit matches this ref
        env:
          EXPECTED: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" != "push" ]; then
            # Scheduled (and dispatched) runs execute on the DEFAULT branch,
            # which is dev — so github.sha is dev's HEAD, while prod deploys
            # from main. Comparing prod against dev guarantees a false "stale
            # deploy" alarm whenever dev is ahead (observed 4x on 2026-08-24).
            # The monitor's question is always "is prod on main's HEAD?".
            EXPECTED=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          fi
          read_commit() {
            curl -fsS --max-time 15 "$API_BASE/health" 2>/dev/null | jq -r '.commit // empty' || echo ""
          }
          DEPLOYED=$(read_commit)
          if [ "$DEPLOYED" != "$EXPECTED" ]; then
            # A push run RACES the deploy it is meant to verify, and a
            # scheduled run can fire while a just-promoted deploy is still
            # building — so on mismatch, poll instead of judging on the
            # first read.
            for _ in $(seq 1 20); do
              sleep 30
              DEPLOYED=$(read_commit)
              [ "$DEPLOYED" = "$EXPECTED" ] && break
            done
          fi
          echo "deployed=${DEPLOYED:-<none>} expected=$EXPECTED"
          if [ "$DEPLOYED" = "$EXPECTED" ]; then
            echo "the promoted build is live"
            exit 0
          fi
          if [ -z "$DEPLOYED" ] || [ "$DEPLOYED" = "unknown" ]; then
            echo "::warning::backend reports no commit (build pre-dates this check, or Coolify did not inject SOURCE_COMMIT) — cannot prove which build is live"
            exit 0
          fi
          if [ "$EVENT" != "schedule" ]; then
            # A commit-attached run only warns: it races the build, and a
            # red check on main reads as a broken commit rather than a slow
            # deploy. The scheduled monitor below is the blocking alarm.
            echo "::warning::prod still runs $DEPLOYED after waiting — the deploy is queued, building or failed; check the prumo-web deployment list in Coolify"
            exit 0
          fi
          echo "::error::prod runs $DEPLOYED but main is $EXPECTED — stale deploy"
          exit 1

      - name: Frontend root
        run: |
          CODE=$(curl -fsSL --max-time 15 -o /dev/null -w "%{http_code}" \
            "$FRONTEND_BASE") || CODE=000
          echo "frontend -> $CODE"
          [ "$CODE" = "200" ]

      - name: API CORS preflight from prod origin
        run: |
          # Selective CORS breakage (allow-list drift in the backend env) is a
          # documented incident class — probe it synthetically, against a
          # route that actually exists (the middleware answers OPTIONS
          # before routing, so a bogus path would pass on a broken build).
          HDR=$(curl -fsS --max-time 15 -o /dev/null -D - \
            -H "Origin: $FRONTEND_BASE" \
            -H "Access-Control-Request-Method: GET" \
            -X OPTIONS \
            "$API_BASE/api/v1/user-api-keys/providers" \
            | grep -i '^access-control-allow-origin' || true)
          echo "cors -> ${HDR:-MISSING}"
          [ -n "$HDR" ]
