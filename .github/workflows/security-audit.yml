name: Dependency Audit

# CVE hygiene for a clinical-research platform: pip-audit on the
# backend lock, npm audit on the frontend lock. Weekly + whenever a
# manifest changes in a PR.

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - backend/pyproject.toml
      - backend/uv.lock
      - package.json
      - package-lock.json
      - .github/workflows/security-audit.yml

jobs:
  pip-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Export locked requirements
        working-directory: backend
        # --no-emit-project: the editable project itself can't be hash-pinned
        # (pip-audit fails with 'no single file to hash' otherwise).
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements-audit.txt
      - name: Audit
        working-directory: backend
        run: uvx pip-audit --strict -r requirements-audit.txt

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # Blocking gate covers shipped (production) dependencies only.
      # Dev-tooling advisories stay visible in the informational step but
      # don't fail the job: they can't reach production and are sometimes
      # unfixable upstream (e.g. GHSA-52cp-r559-cp3m: js-yaml 4.x under
      # @redocly/openapi-core 1.x, pinned by openapi-typescript 7 — the
      # codegen CLI; no compatible fixed release exists as of 2026-07-21).
      - name: Audit production deps (high+ severity, blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all deps (informational)
        run: npm audit --audit-level=high || true
