    <script>
      // Apply the stored theme before first paint so a reload never flashes
      // the light theme. frontend/contexts/ThemeContext.tsx owns the class
      // afterwards and reads the same key; its test pins both sides.
      (function () {
        try {
          var stored = localStorage.getItem('prumo:theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* storage or matchMedia unavailable: the provider applies it after mount */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script src="/frontend/main.tsx" type="module"></script>
  </body>
</html>
